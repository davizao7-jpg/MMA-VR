<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCTÓGONO VR</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#000;height:100%;width:100%;font-family:Arial,Helvetica,sans-serif}
  #vrBtn{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    padding:18px 36px;font-size:22px;font-weight:bold;letter-spacing:1px;
    background:#b30000;color:#fff;border:2px solid #ff4d4d;border-radius:10px;
    cursor:pointer;z-index:10;box-shadow:0 0 25px rgba(255,0,0,.6);
  }
  #vrBtn:disabled{background:#444;border-color:#666;box-shadow:none;cursor:default}
  #info{
    position:fixed;left:0;right:0;bottom:0;color:#ccc;text-align:center;
    font-size:13px;padding:10px;background:rgba(0,0,0,.5);z-index:9;
  }
  #noxr{
    position:fixed;left:50%;top:60%;transform:translate(-50%,0);color:#ff6666;
    font-size:14px;text-align:center;max-width:80vw;z-index:9;
  }
</style>
</head>
<body>
<button id="vrBtn">ENTRAR NO OCTÓGONO (VR)</button>
<div id="info">Meta Quest 2: abra este link no Navegador do Quest. Soque de verdade, avance o corpo pra derrubar, envolva o pescoço com as duas mãos e segure pra finalizar. Configure um limite de area (guardian) de pelo menos 6,5m x 6,5m para melhor aproveitamento.</div>
<div id="noxr"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ==========================================================================
   OCTÓGONO VR - protótipo de luta de MMA em WebXR (Meta Quest 2)
   - Sem botões de ação: soco = velocidade real da mão perto do adversário
   - Queda = avançar o corpo (empurrão) perto do adversário em pé
   - Ground and pound = socar a cabeça dele enquanto está caído
   - Finalização (mata-leão) = as duas mãos perto do pescoço dele, segurando
   - Sem barra de vida: dano só aparece como sangue, cambaleio e desmaio
   ========================================================================== */

let renderer, scene, camera, clock;
let controller0, controller1, controllerGroups = [];
let prevCtrlPos = [new THREE.Vector3(), new THREE.Vector3()];
let ctrlVel = [new THREE.Vector3(), new THREE.Vector3()];
let lastPunchTime = [0,0];
let xrSessionActive = false;
let prevCamPos = new THREE.Vector3();
let camVel = new THREE.Vector3();

const PUNCH_COOLDOWN = 0.30;
const PUNCH_SPEED_MIN = 1.4;      // m/s mínimo pra contar como soco
const HEAD_RADIUS = 0.15;
const TORSO_RADIUS = 0.26;
const NECK_RADIUS = 0.17;
const CHOKE_TIME_NEEDED = 4.2;    // segundos segurando o pescoço
const TAKEDOWN_RANGE = 0.70;
const TAKEDOWN_COOLDOWN = 1.1;
let lastTakedownAttempt = -99;

let bloodTex = null;
const activeParticles = [];
const bloodDecalCap = 70;

let statusPanel, statusCtx, statusTex;
let bell;

init();

function init(){
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x000000, 0.045);

  camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.05, 60);

  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = false;
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  clock = new THREE.Clock();

  buildLights();
  buildArena();
  buildStatusPanel();
  buildBell();
  buildBloodTexture();

  buildControllers();

  window.addEventListener('resize', onResize);
  setupVRButton();

  renderer.setAnimationLoop(render);
}

/* ---------------------------- VR bootstrap ---------------------------- */
function setupVRButton(){
  const btn = document.getElementById('vrBtn');
  const noxr = document.getElementById('noxr');
  if(!('xr' in navigator)){
    btn.disabled = true;
    btn.textContent = 'WEBXR NÃO DISPONÍVEL NESTE NAVEGADOR';
    noxr.textContent = 'Abra esta página pelo Navegador do Meta Quest 2 (Oculus Browser).';
    return;
  }
  navigator.xr.isSessionSupported('immersive-vr').then(ok=>{
    if(!ok){
      btn.disabled = true;
      btn.textContent = 'VR IMERSIVO NÃO SUPORTADO';
      noxr.textContent = 'Este dispositivo/navegador não suporta immersive-vr.';
    }
  });
  btn.addEventListener('click', async ()=>{
    try{
      const session = await navigator.xr.requestSession('immersive-vr', {
        optionalFeatures: ['local-floor','bounded-floor','hand-tracking']
      });
      renderer.xr.setReferenceSpaceType('local-floor');
      await renderer.xr.setSession(session);
      btn.style.display = 'none';
      document.getElementById('info').style.display = 'none';
      xrSessionActive = true;
      playBell();
      setStatus('LUTA!');
      session.addEventListener('end', ()=>{
        xrSessionActive = false;
        btn.style.display = 'block';
        document.getElementById('info').style.display = 'block';
      });
    }catch(e){
      noxr.textContent = 'Não foi possível iniciar a sessão VR: ' + e.message;
    }
  });
}

function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

/* ------------------------------ Iluminação ------------------------------ */
function buildLights(){
  scene.background = new THREE.Color(0x020202);
  const amb = new THREE.AmbientLight(0x404050, 1.1);
  scene.add(amb);
  const hemi = new THREE.HemisphereLight(0x777788, 0x110000, 0.7);
  scene.add(hemi);

  const positions = [[1.6,3.2,1.6],[-1.6,3.2,1.6],[1.6,3.2,-1.6],[-1.6,3.2,-1.6]];
  positions.forEach(p=>{
    const sp = new THREE.SpotLight(0xfff2dd, 2.2, 9, Math.PI/4.5, 0.5, 1.2);
    sp.position.set(p[0],p[1],p[2]);
    sp.target.position.set(0,0.9,0);
    scene.add(sp); scene.add(sp.target);
    const fixture = new THREE.Mesh(new THREE.SphereGeometry(0.08,8,8),
      new THREE.MeshBasicMaterial({color:0xfff2dd}));
    fixture.position.copy(sp.position);
    scene.add(fixture);
  });
}

/* -------------------------------- Arena -------------------------------- */
function buildArena(){
  // Raio do octógono em metros. Aumente/diminua conforme o limite de área (guardian)
  // que você configurou no Quest 2 - o ideal é que o diâmetro (R*2) seja um pouco
  // MENOR que o menor lado do seu guardian, pra caber com folga.
  const R = 3.2;
  window.ARENA_R = R;

  // Tapete octogonal
  const matShape = new THREE.CylinderGeometry(R, R, 0.05, 8);
  const matTex = createMatTexture();
  const matMat = new THREE.MeshStandardMaterial({map: matTex, roughness:0.95});
  const mat = new THREE.Mesh(matShape, matMat);
  mat.position.y = -0.025;
  scene.add(mat);
  window.__matMesh = mat;
  window.__matTex = matTex;
  window.__matCanvas = matTex.image;

  // Poste + gradil (jaula) nos 8 lados
  const fenceTex = createFenceTexture();
  const fenceMat = new THREE.MeshStandardMaterial({map: fenceTex, transparent:true, opacity:0.55, side:THREE.DoubleSide, roughness:0.8});
  const postMat = new THREE.MeshStandardMaterial({color:0x1a1a1a, roughness:0.6, metalness:0.3});
  const padMat = new THREE.MeshStandardMaterial({color:0x7a0000, roughness:0.9});

  const sides = 8, wallH = 1.85;
  for(let i=0;i<sides;i++){
    const a0 = (i/sides)*Math.PI*2;
    const a1 = ((i+1)/sides)*Math.PI*2;
    const x0 = Math.cos(a0)*R, z0 = Math.sin(a0)*R;
    const x1 = Math.cos(a1)*R, z1 = Math.sin(a1)*R;
    const segLen = Math.hypot(x1-x0, z1-z0);
    const midx = (x0+x1)/2, midz=(z0+z1)/2;
    const ang = Math.atan2(z1-z0, x1-x0);

    // painel de tela
    const panel = new THREE.Mesh(new THREE.PlaneGeometry(segLen, wallH), fenceMat);
    panel.position.set(midx, wallH/2, midz);
    panel.rotation.y = -ang;
    scene.add(panel);

    // poste
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,wallH+0.3,8), postMat);
    post.position.set(x0, (wallH+0.3)/2, z0);
    scene.add(post);

    // acolchoado vermelho na base
    const pad = new THREE.Mesh(new THREE.BoxGeometry(segLen,0.4,0.06), padMat);
    pad.position.set(midx, 0.2, midz);
    pad.rotation.y = -ang;
    scene.add(pad);
  }

  // arquibancada sugerida (silhueta escura ao fundo)
  const standTex = createStandTexture();
  const stand = new THREE.Mesh(
    new THREE.CylinderGeometry(9,9,4,32,1,true),
    new THREE.MeshBasicMaterial({map:standTex, side:THREE.BackSide, transparent:true, opacity:0.9})
  );
  stand.position.y = 2;
  scene.add(stand);
}

function createMatTexture(){
  const c = document.createElement('canvas'); c.width=1024; c.height=1024;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#3a0000'; ctx.fillRect(0,0,1024,1024);
  // linhas do octógono
  ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 6;
  ctx.beginPath();
  for(let i=0;i<=8;i++){
    const a = (i/8)*Math.PI*2;
    const x = 512+460*Math.cos(a), y = 512+460*Math.sin(a);
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.closePath(); ctx.stroke();
  ctx.beginPath(); ctx.arc(512,512,260,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.10)';
  ctx.font = 'bold 90px Arial';
  ctx.textAlign = 'center'; ctx.textBaseline='middle';
  ctx.fillText('M M A', 512, 512);
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}
function createFenceTexture(){
  const c = document.createElement('canvas'); c.width=256;c.height=256;
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,256,256);
  ctx.strokeStyle = 'rgba(180,180,190,0.9)'; ctx.lineWidth=2;
  const step=16;
  for(let x=-256;x<512;x+=step){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x+256,256); ctx.stroke(); }
  for(let x=-256;x<512;x+=step){ ctx.beginPath(); ctx.moveTo(x,256); ctx.lineTo(x+256,0); ctx.stroke(); }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(3,2);
  tex.needsUpdate = true;
  return tex;
}
function createStandTexture(){
  const c = document.createElement('canvas'); c.width=1024;c.height=512;
  const ctx = c.getContext('2d');
  const grad = ctx.createLinearGradient(0,0,0,512);
  grad.addColorStop(0,'#000'); grad.addColorStop(0.5,'#1a0505'); grad.addColorStop(1,'#000');
  ctx.fillStyle = grad; ctx.fillRect(0,0,1024,512);
  ctx.fillStyle = 'rgba(255,220,150,0.5)';
  for(let i=0;i<400;i++){
    ctx.beginPath();
    ctx.arc(Math.random()*1024, 150+Math.random()*250, Math.random()*1.6, 0, Math.PI*2);
    ctx.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}

/* -------------------------- Painel de status (sem barra de vida) -------------------------- */
function buildStatusPanel(){
  const c = document.createElement('canvas'); c.width=512; c.height=128;
  statusCtx = c.getContext('2d');
  statusTex = new THREE.CanvasTexture(c);
  const mat = new THREE.MeshBasicMaterial({map:statusTex, transparent:true});
  statusPanel = new THREE.Mesh(new THREE.PlaneGeometry(1.1,0.28), mat);
  statusPanel.position.set(0, 2.15, -1.7);
  scene.add(statusPanel);
  setStatus('Aproxime-se e soque para atacar');
}
function setStatus(msg){
  statusCtx.clearRect(0,0,512,128);
  statusCtx.fillStyle = 'rgba(0,0,0,0.45)';
  statusCtx.fillRect(0,0,512,128);
  statusCtx.fillStyle = '#ffdddd';
  statusCtx.font = 'bold 40px Arial';
  statusCtx.textAlign='center'; statusCtx.textBaseline='middle';
  statusCtx.fillText(msg, 256, 64);
  statusTex.needsUpdate = true;
}

/* -------------------------------- Sino de reinício -------------------------------- */
function buildBell(){
  const g = new THREE.Group();
  const bellMesh = new THREE.Mesh(new THREE.SphereGeometry(0.13,10,10,0,Math.PI*2,0,Math.PI/1.6),
    new THREE.MeshStandardMaterial({color:0xd4af37, metalness:0.8, roughness:0.3}));
  g.add(bellMesh);
  g.position.set(1.95, 1.05, -1.9);
  scene.add(g);
  bell = g;
}

/* ------------------------------ Sangue (efeito) ------------------------------ */
function buildBloodTexture(){
  const c = document.createElement('canvas'); c.width=128;c.height=128;
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,128,128);
  for(let i=0;i<9;i++){
    const x=40+Math.random()*48, y=40+Math.random()*48, r=8+Math.random()*22;
    const grad = ctx.createRadialGradient(x,y,0,x,y,r);
    grad.addColorStop(0,'rgba(120,0,0,0.95)');
    grad.addColorStop(0.6,'rgba(90,0,0,0.75)');
    grad.addColorStop(1,'rgba(60,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }
  bloodTex = new THREE.CanvasTexture(c);
  bloodTex.needsUpdate = true;
}
function spawnBloodDecal(parentMesh, localPos, scale){
  const mat = new THREE.MeshBasicMaterial({map:bloodTex, transparent:true, depthWrite:false, side:THREE.DoubleSide});
  const geo = new THREE.PlaneGeometry(scale, scale);
  const m = new THREE.Mesh(geo, mat);
  m.position.copy(localPos);
  m.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
  parentMesh.add(m);
  if(!parentMesh.userData.decals) parentMesh.userData.decals = [];
  parentMesh.userData.decals.push(m);
  if(parentMesh.userData.decals.length > bloodDecalCap){
    const old = parentMesh.userData.decals.shift();
    parentMesh.remove(old);
  }
}
function spawnBloodBurst(worldPos, dir){
  for(let i=0;i<6;i++){
    const geo = new THREE.SphereGeometry(0.012+Math.random()*0.012, 4,4);
    const mat = new THREE.MeshBasicMaterial({color:0x8a0000});
    const p = new THREE.Mesh(geo, mat);
    p.position.copy(worldPos);
    scene.add(p);
    const vel = dir.clone().multiplyScalar(0.6+Math.random()*1.2)
      .add(new THREE.Vector3((Math.random()-0.5)*1.2, Math.random()*1.5, (Math.random()-0.5)*1.2));
    activeParticles.push({mesh:p, vel, life:0.7});
  }
}
function spawnFloorBloodPool(pos){
  const geo = new THREE.CircleGeometry(0.01,16);
  const mat = new THREE.MeshBasicMaterial({map:bloodTex, transparent:true, depthWrite:false});
  const m = new THREE.Mesh(geo, mat);
  m.rotation.x = -Math.PI/2;
  m.position.set(pos.x, 0.005, pos.z);
  scene.add(m);
  m.userData.growTo = 0.35+Math.random()*0.1;
  m.userData.grown = 0;
  return m;
}

/* ------------------------------ Controladores/mãos ------------------------------ */
function buildControllers(){
  const gloveGeo = new THREE.SphereGeometry(0.055, 10,10);
  for(let i=0;i<2;i++){
    const ctrl = renderer.xr.getController(i);
    const glove = new THREE.Mesh(gloveGeo, new THREE.MeshStandardMaterial({color:0x8a0000, roughness:0.5}));
    ctrl.add(glove);
    scene.add(ctrl);
    controllerGroups.push(ctrl);
  }
  controller0 = controllerGroups[0];
  controller1 = controllerGroups[1];
}

/* ================================ ADVERSÁRIO ================================ */
const opp = {
  root:null, hip:null, torsoPivot:null, torsoMesh:null, neck:null, head:null,
  lArmPivot:null, rArmPivot:null,
  health:100, maxHealth:100,
  state:'standing', // standing | staggered | falling | down | gettingUp | ko | finished
  stateTimer:0,
  fallFrom:{pos:new THREE.Vector3(), quat:new THREE.Quaternion()},
  fallTo:{pos:new THREE.Vector3(), quat:new THREE.Quaternion()},
  fallElapsed:0, fallDuration:0.55,
  standDuration:0.55,
  attackTimer: 1.5+Math.random()*2,
  attackSwing: null, attacking:false, attackT:0,
  getUpTimer:0,
  chokeProgress:0,
  bloodPool:null,
  facingBase: new THREE.Quaternion(),
};

function buildOpponent(){
  const skinMat = new THREE.MeshStandardMaterial({color:0xc9906a, roughness:0.65});
  opp.skinMat = skinMat;

  const R0 = window.ARENA_R || 3.2;
  opp.root = new THREE.Group();
  opp.root.position.set(0,0,-(R0*0.55));
  scene.add(opp.root);
  opp.aiTimer = 0.6;
  opp.aiMode = 'approach';
  opp.circleDir = Math.random()<0.5 ? 1 : -1;

  opp.hip = new THREE.Group();
  opp.hip.position.set(0,0.92,0);
  opp.root.add(opp.hip);

  const shortsMat = new THREE.MeshStandardMaterial({color:0x141414, roughness:0.8});
  const shorts = new THREE.Mesh(new THREE.CylinderGeometry(0.19,0.16,0.22,10), shortsMat);
  shorts.position.set(0,0.0,0);
  opp.hip.add(shorts);

  // pernas simples
  [-0.11,0.11].forEach(x=>{
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.06,0.85,8), skinMat);
    leg.position.set(x,-0.42,0);
    opp.hip.add(leg);
  });

  opp.torsoPivot = new THREE.Group();
  opp.torsoPivot.position.set(0,0.1,0);
  opp.hip.add(opp.torsoPivot);

  opp.torsoMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.20,0.24,0.56,10), skinMat);
  opp.torsoMesh.position.set(0,0.28,0);
  opp.torsoPivot.add(opp.torsoMesh);

  opp.neck = new THREE.Group();
  opp.neck.position.set(0,0.56,0);
  opp.torsoPivot.add(opp.neck);

  opp.head = new THREE.Mesh(new THREE.SphereGeometry(0.135,14,14), skinMat);
  opp.head.position.set(0,0.14,0);
  opp.neck.add(opp.head);

  // braços (ombro -> antebraço -> luva)
  function buildArm(sign){
    const shoulder = new THREE.Group();
    shoulder.position.set(0.26*sign, 0.5, 0);
    opp.torsoPivot.add(shoulder);
    const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.055,0.28,8), skinMat);
    upper.position.set(0,-0.14,0);
    shoulder.add(upper);
    const elbow = new THREE.Group();
    elbow.position.set(0,-0.28,0);
    shoulder.add(elbow);
    const fore = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.045,0.26,8), skinMat);
    fore.position.set(0,-0.13,0.02);
    elbow.add(fore);
    const glove = new THREE.Mesh(new THREE.SphereGeometry(0.07,10,10),
      new THREE.MeshStandardMaterial({color:0x7a0000, roughness:0.5}));
    glove.position.set(0,-0.27,0.04);
    elbow.add(glove);
    shoulder.rotation.x = -0.15*sign*0 + (-0.1);
    return shoulder;
  }
  opp.lArmPivot = buildArm(1);
  opp.rArmPivot = buildArm(-1);

  opp.facingBase.copy(opp.root.quaternion);
}
buildOpponent();

/* estado auxiliar de reação (cabeça/torso) */
let headKick = 0, headKickVel = 0;
let torsoLean = 0, torsoLeanVel = 0;

function neckWorldPos(){ return opp.neck.getWorldPosition(new THREE.Vector3()); }
function headWorldPos(){ return opp.head.getWorldPosition(new THREE.Vector3()); }
function torsoTopWorldPos(){
  const p = new THREE.Vector3(0,0.5,0);
  return opp.torsoPivot.localToWorld(p);
}
function torsoBotWorldPos(){
  const p = new THREE.Vector3(0,0.02,0);
  return opp.torsoPivot.localToWorld(p);
}
function closestPointOnSegment(p, a, b){
  const ab = b.clone().sub(a);
  const t = THREE.MathUtils.clamp(p.clone().sub(a).dot(ab)/ab.lengthSq(), 0,1);
  return a.clone().add(ab.multiplyScalar(t));
}

/* ------------------------------ Dano / reações ------------------------------ */
function applyDamage(amount, isHead){
  opp.health = Math.max(0, opp.health - amount);
  const dmgRatio = 1 - (opp.health/opp.maxHealth);
  opp.skinMat.color.lerpColors(new THREE.Color(0xc9906a), new THREE.Color(0x5a0f0f), Math.min(1,dmgRatio*0.85));
  if(opp.health<=0 && opp.state!=='ko' && opp.state!=='finished'){
    koOpponent();
  }
}
function koOpponent(){
  opp.state = 'ko';
  startFall(new THREE.Vector3(0,0,1));
  setStatus('NOCAUTE!');
}
function finishSubmission(){
  opp.state = 'finished';
  setStatus('FINALIZAÇÃO! MATA-LEÃO!');
}

function registerHeadHit(speed, controllerVel, hitPoint){
  const power = THREE.MathUtils.clamp(speed*9, 6, 42);
  applyDamage(power, true);
  headKickVel += THREE.MathUtils.clamp(speed*0.35, 0.2, 1.4);
  torsoLeanVel += 0.4;
  const local = opp.head.worldToLocal(hitPoint.clone());
  spawnBloodDecal(opp.head, local, 0.05+Math.random()*0.05);
  const dir = controllerVel.clone().normalize();
  spawnBloodBurst(hitPoint, dir);
  pulseHaptics();
  playThud(true);
  if(opp.health>0 && power>26 && Math.random()<0.45 && opp.state==='standing'){
    opp.state='staggered'; opp.stateTimer=0.5;
  }
}
function registerBodyHit(speed, controllerVel, hitPoint){
  const power = THREE.MathUtils.clamp(speed*5.5, 4, 24);
  applyDamage(power, false);
  torsoLeanVel += 0.25;
  const local = opp.torsoMesh.worldToLocal(hitPoint.clone());
  spawnBloodDecal(opp.torsoMesh, local, 0.05+Math.random()*0.06);
  const dir = controllerVel.clone().normalize();
  spawnBloodBurst(hitPoint, dir);
  pulseHaptics();
  playThud(false);
}
function registerGroundPound(speed, controllerVel, hitPoint){
  const power = THREE.MathUtils.clamp(speed*11, 8, 38);
  applyDamage(power, true);
  const local = opp.head.worldToLocal(hitPoint.clone());
  spawnBloodDecal(opp.head, local, 0.06+Math.random()*0.07);
  spawnBloodBurst(hitPoint, controllerVel.clone().normalize());
  if(opp.bloodPool) opp.bloodPool.userData.growTo += 0.03;
  opp.getUpTimer = Math.max(opp.getUpTimer, 3.0); // atordoa mais tempo no chão
  pulseHaptics();
  playThud(true);
}

/* ------------------------------ Queda / levantar ------------------------------ */
function startFall(pushDirWorldXZ){
  opp.state = (opp.state==='ko') ? 'ko' : 'falling';
  opp.fallElapsed = 0;
  opp.fallFrom.pos.copy(opp.root.position);
  opp.fallFrom.quat.copy(opp.root.quaternion);

  const backAxis = new THREE.Vector3(pushDirWorldXZ.z, 0, -pushDirWorldXZ.x).normalize();
  const fallQuat = new THREE.Quaternion().setFromAxisAngle(backAxis, Math.PI/2*(Math.random()<0.5?1:-1));
  opp.fallTo.quat.copy(opp.root.quaternion).premultiply(new THREE.Quaternion()); // baseline
  opp.fallTo.quat = opp.root.quaternion.clone().multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), Math.PI/2));

  const back = pushDirWorldXZ.clone().normalize().multiplyScalar(-0.35);
  opp.fallTo.pos = opp.root.position.clone().add(back);
  opp.fallTo.pos.y = 0.02;

  opp.getUpTimer = 5.5;
  if(!opp.bloodPool){
    opp.bloodPool = spawnFloorBloodPool(opp.root.position);
  }
}
function startGetUp(){
  opp.state = 'gettingUp';
  opp.fallElapsed = 0;
  opp.fallFrom.pos.copy(opp.root.position);
  opp.fallFrom.quat.copy(opp.root.quaternion);
  opp.fallTo.pos.set(opp.root.position.x, 0, opp.root.position.z);
  opp.fallTo.quat.copy(opp.facingBase);
}

function attemptTakedown(playerXZDir){
  const resistChance = 0.40 - (1-opp.health/opp.maxHealth)*0.28; // mais fraco = resiste menos
  if(Math.random() < resistChance){
    opp.state='staggered'; opp.stateTimer=0.35;
    setStatus('Ele resistiu à queda!');
  } else {
    startFall(playerXZDir);
    setStatus('DERRUBADO! Finalize ou continue batendo');
  }
}

/* ------------------------------ IA / animação idle ------------------------------ */
function updateOpponentAI(dt, camXZ){
  if(opp.state==='standing'){
    opp.root.lookAt(camXZ.x, opp.root.position.y, camXZ.z);
    const toPlayer = new THREE.Vector3(camXZ.x-opp.root.position.x,0,camXZ.z-opp.root.position.z);
    const dist = toPlayer.length();
    const dirToPlayer = toPlayer.clone().normalize();

    // Escolhe um "modo" de deslocamento de tempos em tempos: aproximar, recuar
    // ou circular - assim ele realmente caminha pelo octógono, não só avança reto.
    opp.aiTimer -= dt;
    if(opp.aiTimer<=0){
      opp.aiTimer = 0.9 + Math.random()*1.4;
      if(Math.random()<0.15) opp.circleDir *= -1;
      if(dist>1.9) opp.aiMode = 'approach';
      else if(dist<0.55) opp.aiMode = Math.random()<0.65 ? 'retreat' : 'circle';
      else {
        const r = Math.random();
        opp.aiMode = r<0.45 ? 'approach' : (r<0.8 ? 'circle' : 'retreat');
      }
    }
    let moveDir = new THREE.Vector3();
    let moveSpeed = 0.5;
    if(opp.aiMode==='approach'){ moveDir.copy(dirToPlayer); moveSpeed = 0.55; }
    else if(opp.aiMode==='retreat'){ moveDir.copy(dirToPlayer).multiplyScalar(-1); moveSpeed = 0.5; }
    else { // circle: anda perpendicular ao vetor até o jogador
      moveDir.set(dirToPlayer.z, 0, -dirToPlayer.x).multiplyScalar(opp.circleDir);
      moveSpeed = 0.65;
    }
    // sempre mantém uma leve tendência a não ficar longe demais nem colar demais
    if(dist>2.2) moveDir.lerp(dirToPlayer, 0.5);
    if(dist<0.45) moveDir.lerp(dirToPlayer.clone().multiplyScalar(-1), 0.6);

    opp.root.position.addScaledVector(moveDir, dt*moveSpeed);

    // mantém o adversário dentro da jaula
    const R0 = window.ARENA_R || 3.2;
    const maxR = R0-0.35;
    if(opp.root.position.length() > maxR){
      opp.root.position.setLength(maxR);
    }

    const t = performance.now()*0.002;
    opp.torsoPivot.position.y = 0.1 + Math.sin(t)*0.01;
    opp.lArmPivot.rotation.x = -0.1 + Math.sin(t*1.3)*0.05;
    opp.rArmPivot.rotation.x = -0.1 + Math.sin(t*1.3+Math.PI)*0.05;

    opp.attackTimer -= dt;
    if(opp.attackTimer<=0 && !opp.attacking){
      opp.attacking = true; opp.attackT = 0;
      opp.attackSwing = Math.random()<0.5 ? opp.lArmPivot : opp.rArmPivot;
      opp.attackTimer = 2.2+Math.random()*2.3;
    }
    if(opp.attacking){
      opp.attackT += dt*3.2;
      const s = Math.sin(Math.min(opp.attackT,Math.PI));
      opp.attackSwing.rotation.x = -0.1 - s*1.3;
      if(opp.attackT>=Math.PI/2 && opp.attackT-dt*3.2<Math.PI/2){
        // momento de extensão máxima: checa se acertou o jogador
        const fist = new THREE.Vector3(); opp.attackSwing.children[1]?.children[0]?.getWorldPosition(fist);
        const camWorld = camera.getWorldPosition(new THREE.Vector3());
        if(fist.length() && fist.distanceTo(camWorld) < 0.35 && camVel.length()<0.4){
          flashDazed();
        }
      }
      if(opp.attackT>=Math.PI){ opp.attacking=false; }
    }
  } else if(opp.state==='staggered'){
    opp.stateTimer -= dt;
    if(opp.stateTimer<=0) opp.state='standing';
  } else if(opp.state==='falling' || opp.state==='gettingUp'){
    opp.fallElapsed += dt;
    const t = Math.min(1, opp.fallElapsed/opp.fallDuration);
    const et = 1-Math.pow(1-t,3);
    opp.root.position.lerpVectors(opp.fallFrom.pos, opp.fallTo.pos, et);
    opp.root.quaternion.slerpQuaternions(opp.fallFrom.quat, opp.fallTo.quat, et);
    if(t>=1){
      if(opp.state==='falling') opp.state = (opp.health<=0)?'ko':'down';
      else opp.state = 'standing';
    }
  } else if(opp.state==='down'){
    opp.getUpTimer -= dt;
    // luta debilitada tentando se levantar
    const wig = Math.sin(performance.now()*0.01)*0.05;
    opp.lArmPivot.rotation.z = wig;
    if(opp.getUpTimer<=0){
      startGetUp();
    }
  }
  // pool de sangue cresce enquanto ele fica caído/atordoado
  if(opp.bloodPool){
    const g = opp.bloodPool.userData;
    if(g.grown < g.growTo){
      g.grown = Math.min(g.growTo, g.grown+dt*0.05);
      opp.bloodPool.scale.set(g.grown/0.35+0.05, g.grown/0.35+0.05, 1);
    }
  }

  // reações de cabeça/torso (mola amortecida)
  headKickVel += -headKick*22*dt - headKickVel*6*dt;
  headKick += headKickVel*dt;
  opp.neck.rotation.x = -headKick;

  torsoLeanVel += -torsoLean*14*dt - torsoLeanVel*5*dt;
  torsoLean += torsoLeanVel*dt;
  opp.torsoPivot.rotation.x = -torsoLean*0.5;
}

function flashDazed(){
  dazedFlash = 1.0;
}
let dazedFlash = 0;
let dazedPlane;
function buildDazedOverlay(){
  const geo = new THREE.PlaneGeometry(1,1);
  const mat = new THREE.MeshBasicMaterial({color:0x550000, transparent:true, opacity:0, depthTest:false, depthWrite:false});
  dazedPlane = new THREE.Mesh(geo, mat);
  dazedPlane.position.set(0,0,-0.3);
  dazedPlane.renderOrder = 999;
  camera.add(dazedPlane);
  scene.add(camera);
}
buildDazedOverlay();

/* ------------------------------ Áudio simples ------------------------------ */
let audioCtx;
function ensureAudio(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
function playThud(hard){
  try{
    ensureAudio();
    const dur = 0.12;
    const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate*dur, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<data.length;i++){ data[i] = (Math.random()*2-1)*Math.pow(1-i/data.length,2); }
    const src = audioCtx.createBufferSource(); src.buffer = buffer;
    const gain = audioCtx.createGain(); gain.gain.value = hard?0.9:0.5;
    const filt = audioCtx.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value = hard?260:180;
    src.connect(filt); filt.connect(gain); gain.connect(audioCtx.destination);
    src.start();
  }catch(e){}
}
function playBell(){
  try{
    ensureAudio();
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.type='sine'; o.frequency.value=880;
    g.gain.setValueAtTime(0.4, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+1.4);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+1.4);
  }catch(e){}
}
function pulseHaptics(){
  try{
    [controller0, controller1].forEach(c=>{
      const src = renderer.xr.getSession()?.inputSources;
    });
    const session = renderer.xr.getSession();
    if(session){
      session.inputSources.forEach(src=>{
        const act = src.gamepad && src.gamepad.hapticActuators && src.gamepad.hapticActuators[0];
        if(act) act.pulse(0.7, 90);
      });
    }
  }catch(e){}
}

/* ================================ LOOP PRINCIPAL ================================ */
function render(){
  const dt = Math.min(clock.getDelta(), 0.05);

  if(xrSessionActive){
    const camWorld = camera.getWorldPosition(new THREE.Vector3());
    camVel.copy(camWorld).sub(prevCamPos).divideScalar(Math.max(dt,0.0001));
    prevCamPos.copy(camWorld);

    handleController(0, controller0, dt);
    handleController(1, controller1, dt);
    handleChoke(dt);
    handleTakedown(dt, camWorld);
    handleBellTouch();

    updateOpponentAI(dt, camWorld);
  }

  updateParticles(dt);

  if(dazedFlash>0){
    dazedFlash = Math.max(0, dazedFlash-dt*1.4);
    dazedPlane.material.opacity = dazedFlash*0.35;
  }

  statusPanel.position.set(opp.root.position.x, 2.15, opp.root.position.z - 0.6);
  statusPanel.lookAt(camera.getWorldPosition(new THREE.Vector3()));

  renderer.render(scene, camera);
}

function handleController(ci, ctrl, dt){
  const pos = ctrl.getWorldPosition(new THREE.Vector3());
  const vel = pos.clone().sub(prevCtrlPos[ci]).divideScalar(Math.max(dt,0.0001));
  const speed = vel.length();
  prevCtrlPos[ci].copy(pos);
  ctrlVel[ci].copy(vel);

  lastPunchTime[ci] += dt;
  if(lastPunchTime[ci] < PUNCH_COOLDOWN) return;
  if(speed < PUNCH_SPEED_MIN) return;

  if(opp.state==='standing' || opp.state==='staggered'){
    const headP = headWorldPos();
    if(pos.distanceTo(headP) < HEAD_RADIUS){
      registerHeadHit(speed, vel, pos);
      lastPunchTime[ci]=0;
      return;
    }
    const top = torsoTopWorldPos(), bot = torsoBotWorldPos();
    const closest = closestPointOnSegment(pos, top, bot);
    if(pos.distanceTo(closest) < TORSO_RADIUS){
      registerBodyHit(speed, vel, pos);
      lastPunchTime[ci]=0;
    }
  } else if(opp.state==='down'){
    const headP = headWorldPos();
    if(pos.distanceTo(headP) < HEAD_RADIUS+0.05){
      registerGroundPound(speed, vel, pos);
      lastPunchTime[ci]=0;
    }
  }
}

function handleTakedown(dt, camWorld){
  const now = performance.now()/1000;
  if(opp.state!=='standing') return;
  if(now-lastTakedownAttempt < TAKEDOWN_COOLDOWN) return;
  const toOpp = new THREE.Vector3(opp.root.position.x-camWorld.x,0,opp.root.position.z-camWorld.z);
  const dist = toOpp.length();
  if(dist > TAKEDOWN_RANGE) return;
  const dir = toOpp.clone().normalize();
  const forwardSpeed = new THREE.Vector3(camVel.x,0,camVel.z).dot(dir);
  if(forwardSpeed > 1.0){
    lastTakedownAttempt = now;
    attemptTakedown(dir);
  }
}

function handleChoke(dt){
  if(opp.state==='standing' || opp.state==='ko' || opp.state==='finished'){
    opp.chokeProgress = Math.max(0, opp.chokeProgress - dt*1.5);
    return;
  }
  const neckP = neckWorldPos();
  const p0 = controller0.getWorldPosition(new THREE.Vector3());
  const p1 = controller1.getWorldPosition(new THREE.Vector3());
  const near0 = p0.distanceTo(neckP) < NECK_RADIUS;
  const near1 = p1.distanceTo(neckP) < NECK_RADIUS;
  if(near0 && near1){
    opp.chokeProgress += dt;
    if(opp.chokeProgress > CHOKE_TIME_NEEDED*0.4 && opp.chokeProgress<CHOKE_TIME_NEEDED){
      setStatus('Segurando... ' + Math.ceil(CHOKE_TIME_NEEDED-opp.chokeProgress) + 's');
    }
    if(opp.chokeProgress >= CHOKE_TIME_NEEDED){
      finishSubmission();
    }
  } else {
    opp.chokeProgress = Math.max(0, opp.chokeProgress - dt*1.2);
  }
}

function handleBellTouch(){
  if(opp.state!=='ko' && opp.state!=='finished') return;
  const bp = bell.getWorldPosition(new THREE.Vector3());
  [controller0, controller1].forEach(c=>{
    const p = c.getWorldPosition(new THREE.Vector3());
    if(p.distanceTo(bp) < 0.18){
      resetMatch();
    }
  });
}

function resetMatch(){
  opp.health = opp.maxHealth;
  opp.state = 'standing';
  opp.stateTimer = 0;
  opp.chokeProgress = 0;
  opp.getUpTimer = 0;
  opp.root.position.set(0,0,-1.35);
  opp.root.quaternion.copy(opp.facingBase);
  opp.skinMat.color.set(0xc9906a);
  headKick=0; headKickVel=0; torsoLean=0; torsoLeanVel=0;
  [opp.head, opp.torsoMesh].forEach(m=>{
    if(m.userData.decals){
      m.userData.decals.forEach(d=>m.remove(d));
      m.userData.decals = [];
    }
  });
  if(opp.bloodPool){ scene.remove(opp.bloodPool); opp.bloodPool=null; }
  playBell();
  setStatus('LUTA!');
}

function updateParticles(dt){
  for(let i=activeParticles.length-1;i>=0;i--){
    const p = activeParticles[i];
    p.life -= dt;
    p.vel.y -= 9.8*dt;
    p.mesh.position.addScaledVector(p.vel, dt);
    if(p.mesh.position.y < 0.01){ p.mesh.position.y = 0.01; p.vel.set(0,0,0); }
    p.mesh.scale.setScalar(Math.max(0,p.life/0.7));
    if(p.life<=0){
      scene.remove(p.mesh);
      activeParticles.splice(i,1);
    }
  }
}
